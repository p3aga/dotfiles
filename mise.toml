[bootstrap.services.tailscaled]
state = "running"
enabled = true

[bootstrap.services.libvirtd]
state = "running"
enabled = true

[bootstrap.services.sshd]
state = "running"
enabled = true

[bootstrap.services.abrtd]
state = "stopped"
enabled = false

[bootstrap.files."/etc/dconf/db/local.d/98-custom-extensions"]
source = "./gnome/98-custom-extensions.conf"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/dconf/db/local.d/99-custom-settings"]
source = "./gnome/99-custom-settings.conf"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.repos]
"~/.config/nvim" = { url = "https://github.com/p3aga/nvim-config.git" }

[bootstrap.hooks.final]
run = [
  "sudo sed -i '/^# firewall_backend = \"nftables\"$/s/^# //' /etc/libvirt/network.conf",
  "dconf reset /org/gnome/shell/enabled-extensions",
  "dconf update",
]
